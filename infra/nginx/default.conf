# ProbeDesk same-origin web delivery.
#
# nginx serves the Angular browser bundle, falls back to index.html for client
# routes, and proxies /api to the API container. The API location deliberately
# uses HTTP/1.1 with buffering, caching and gzip disabled so Server-Sent Events
# are flushed to the browser as soon as the API writes them.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 2m;

    # Docker's embedded DNS. Resolving the API name per request means a
    # recreated API container does not leave nginx pinned to an old address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # `^~` prevents the static-asset regex below from capturing Swagger UI
    # paths such as /api/docs/swagger-ui.css.
    location ^~ /api/ {
        set $api_backend http://api:3000;
        proxy_pass $api_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";

        # SSE must not be buffered, cached or compressed anywhere in nginx.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
        gzip off;
    }

    location = /api {
        return 308 /api/;
    }

    # Angular's production build emits content-hashed files. They are safe to
    # cache aggressively; index.html is handled separately below.
    location ~* \.(?:js|css|woff2?|ico|png|svg|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # History fallback: /runs/:id, /plans/:id/edit and every other client route
    # must return index.html on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
