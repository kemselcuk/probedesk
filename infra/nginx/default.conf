# ProbeDesk same-origin web delivery.
#
# nginx serves the Angular browser bundle, falls back to index.html for client
# routes, and proxies /api to the API container. The API location deliberately
# uses HTTP/1.1 with buffering, caching and gzip disabled so Server-Sent Events
# are flushed to the browser as soon as the API writes them.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 2m;

    # Keep redirects relative. With absolute redirects nginx builds the
    # Location from its internal listen port (8080) and drops a custom
    # PROBEDESK_DELIVERY_PORT such as 18080.
    absolute_redirect off;

    # Docker's embedded DNS. Resolving the API name per request means a
    # recreated API container does not leave nginx pinned to an old address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # `^~` prevents the static-asset regex below from capturing Swagger UI
    # paths such as /api/docs/swagger-ui.css.
    location ^~ /api/ {
        set $api_backend http://api:3000;
        proxy_pass $api_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite rather than append: Express trusts this header exactly one
        # hop when TRUST_PROXY=true, and the login throttle keys on it. Letting
        # a client supply extra addresses would let it rotate synthetic IPs.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        # Defence in depth: the API disables this itself, but never expose it.
        proxy_hide_header X-Powered-By;

        # SSE must not be buffered, cached or compressed anywhere in nginx.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
        gzip off;
    }

    location = /api {
        return 308 /api/;
    }

    # Angular's production build emits content-hashed files. They are safe to
    # cache aggressively; index.html is handled separately below. A location
    # that declares add_header stops inheriting any outer add_header set, so
    # the security headers are repeated explicitly here.
    location ~* \.(?:js|css|woff2?|ico|png|svg|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Swagger UI is proxied under /api/ and intentionally gets no CSP; the
        # SPA is a static bundle and can enforce a strict policy.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # History fallback: /runs/:id, /plans/:id/edit and every other client route
    # must return index.html on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
